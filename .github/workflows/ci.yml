name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # hermes-setup.sh scala config.yaml przez ruamel.yaml; bez niego testy scalania są pomijane.
      - name: Python venv with ruamel.yaml (hermes-setup tests)
        run: |
          python3 -m venv "$RUNNER_TEMP/hermes-venv"
          "$RUNNER_TEMP/hermes-venv/bin/pip" install --quiet 'ruamel.yaml>=0.18,<0.20'
          echo "HERMES_SETUP_PYTHON=$RUNNER_TEMP/hermes-venv/bin/python" >> "$GITHUB_ENV"
      - run: npm test
        env:
          AGENT_LB_CONFIG: /tmp/agent-lb-ci/config.json
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t agent-lb:verify .
