services:
  agent-lb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/tomaasz/agent-lb:latest
    container_name: agent-lb
    restart: unless-stopped
    ports:
      - "127.0.0.1:3456:3456"
    volumes:
      # Mount persistent directory containing agent-lb.json config and state
      - ./data:/data
    environment:
      - NODE_ENV=production
      - AGENT_LB_PORT=3456
      - AGENT_LB_HOST=0.0.0.0
      # Optional: specify allowed hosts header for reverse proxies
      # - AGENT_LB_HOST=your-domain.com

